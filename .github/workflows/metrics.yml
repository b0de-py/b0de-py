name: Metrics

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/metrics.yml"]

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: b0de-py
          template: classic
          filename: github-metrics.svg
          committer_message: "chore: update github metrics [skip ci]"
          config_timezone: America/Sao_Paulo

          # Only aggregate numbers: no section here lists repository names.
          base: header, activity, community, repositories, metadata

          # Languages: percentages only. Leave indepth off (it scans commits).
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          plugin_languages_indepth: no

          # Contribution calendar: counts per day only.
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # Painel preto no estilo do site (fundo, borda e cores do r4ul.com.br)
          extras_css: |
            :root{background:#0a0a0a;outline:1px solid #2a2a2a;outline-offset:-1px}
            svg{color:#b0b0b0}
            .items-wrapper svg{fill:#666}
            h2,h3{color:#00ff00 !important}
            h2 svg,h3 svg{fill:#00ff00 !important}
            .field{color:#b0b0b0}

          # Deliberately NOT enabled (they can print repo names):
          # plugin_activity, plugin_notable, plugin_lines, plugin_habits,
          # plugin_topics, plugin_stars, plugin_pagespeed, plugin_projects
